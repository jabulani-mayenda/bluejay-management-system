<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes | Bluejay School</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body>
    <div class="app">
        <div id="sidebar-placeholder"></div>
        <div class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="topbar-title">Classes</div>
                    <div class="topbar-path">Head Teacher / Classes</div>
                </div>
            </header>
            <div class="page-content">
                <div class="ph">
                    <div>
                        <h1>Class Management</h1>
                        <p>Add and manage classes and sections</p>
                    </div>
                    <div class="ph-actions"><button class="btn btn-primary" onclick="openAddModal()"><span
                                class="material-icons-round">add</span> Add Class</button></div>
                </div>
                <div id="classes-grid">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="add-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="m-title">Add Class</div><button class="modal-close"
                    onclick="closeModal('add-modal')"><span class="material-icons-round">close</span></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="e-id">
                <div class="form-row form-row-2">
                    <div class="form-group"><label class="form-label">Class Name <span
                                class="req">*</span></label><input class="form-control" id="f-name"
                            placeholder="e.g. Grade 5, Standard 3"></div>
                    <div class="form-group"><label class="form-label">Section</label><select class="form-control"
                            id="f-section">
                            <option value="">None</option>
                            <option>A</option>
                            <option>B</option>
                            <option>C</option>
                            <option>D</option>
                        </select></div>
                    <div class="form-group"><label class="form-label">Academic Year</label><select class="form-control"
                            id="f-year">
                            <option>2024/2025</option>
                            <option>2025/2026</option>
                        </select></div>
                    <div class="form-group"><label class="form-label">Class Teacher</label><select class="form-control"
                            id="f-teacher">
                            <option value="">None / TBA</option>
                        </select></div>
                </div>
            </div>
            <div class="modal-footer"><button class="btn btn-outline"
                    onclick="closeModal('add-modal')">Cancel</button><button class="btn btn-primary"
                    onclick="saveClass()">Save Class</button></div>
        </div>
    </div>

    <!-- Class details (students in class) modal -->
    <div class="overlay" id="view-modal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <div class="modal-title" id="view-title">Class Students</div><button class="modal-close"
                    onclick="closeModal('view-modal')"><span class="material-icons-round">close</span></button>
            </div>
            <div class="modal-body" id="view-body"></div>
        </div>
    </div>

    <script src="../../config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/shared.js"></script>
    <script>
        (async () => {
            await initApp(['head_teacher']);
            const { data: teachers } = await db.from('profiles').select('id,full_name').eq('role', 'teacher').eq('status', 'active').order('full_name');
            (teachers || []).forEach(t => document.getElementById('f-teacher').insertAdjacentHTML('beforeend', `<option value="${t.id}">${t.full_name}</option>`));
            loadClasses();
        })();

        async function loadClasses() {
            const el = document.getElementById('classes-grid');
            const { data: classes } = await db.from('classes').select('*,profiles!classes_class_teacher_id_fkey(full_name)').order('name');
            if (!classes?.length) { el.innerHTML = '<div class="empty"><span class="material-icons-round">class</span><h3>No classes yet</h3></div>'; return; }

            const counts = await Promise.all(classes.map(c => db.from('students').select('*', { count: 'exact', head: true }).eq('class_id', c.id).eq('status', 'active')));
            const subCounts = await Promise.all(classes.map(c => db.from('subjects').select('*', { count: 'exact', head: true }).eq('class_id', c.id)));

            el.innerHTML = `<div class="grid-3">` + classes.map((c, i) => `
    <div class="card" style="cursor:pointer" onclick="viewClass('${c.id}','${c.name} ${c.section || ''}')">
      <div class="card-body" style="text-align:center;padding:28px 20px">
        <div style="width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:white">${c.name.charAt(0)}</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:4px">Class ${c.name} ${c.section || ''}</div>
        <div class="text-muted mb-20">${c.academic_year || '2024/2025'}</div>
        <div class="grid-2" style="gap:10px;text-align:center;margin-bottom:14px">
          <div style="background:var(--primary-light);border-radius:8px;padding:10px"><div style="font-size:22px;font-weight:900;color:var(--primary)">${counts[i].count || 0}</div><div style="font-size:11px;color:var(--text-3)">Students</div></div>
          <div style="background:var(--success-light);border-radius:8px;padding:10px"><div style="font-size:22px;font-weight:900;color:var(--success)">${subCounts[i].count || 0}</div><div style="font-size:11px;color:var(--text-3)">Subjects</div></div>
        </div>
        <div class="text-muted" style="font-size:12px">👩‍🏫 ${c.profiles?.full_name || 'No class teacher'}</div>
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--border-2);display:flex;gap:8px">
        <button class="btn btn-sm btn-outline w-full" onclick="event.stopPropagation();editClass(${JSON.stringify(c).replace(/"/g, '&quot;')})"><span class="material-icons-round">edit</span> Edit</button>
        <button class="btn btn-sm btn-danger btn-sm" onclick="event.stopPropagation();deleteClass('${c.id}','${c.name}')"><span class="material-icons-round">delete</span></button>
      </div>
    </div>`).join('') + `</div>`;
        }

        async function viewClass(id, name) {
            document.getElementById('view-title').textContent = 'Class ' + name + ' — Students';
            const el = document.getElementById('view-body');
            const { data } = await db.from('students').select('id,full_name,gender,fees_total,fees_paid').eq('class_id', id).eq('status', 'active').order('full_name');
            if (!data?.length) { el.innerHTML = '<div class="empty"><span class="material-icons-round">school</span><h3>No students in this class</h3></div>'; }
            else el.innerHTML = `<table class="tbl"><thead><tr><th>Name</th><th>ID</th><th>Gender</th><th>Fee Status</th></tr></thead><tbody>${data.map(s => `<tr><td>${s.full_name}</td><td>${s.id}</td><td>${s.gender || '—'}</td><td>${feeStatus(s.fees_paid, s.fees_total)}</td></tr>`).join('')}</tbody></table>`;
            openModal('view-modal');
        }

        function openAddModal() {
            document.getElementById('e-id').value = '';
            document.getElementById('f-name').value = '';
            document.getElementById('f-section').value = '';
            document.getElementById('f-teacher').value = '';
            document.getElementById('m-title').textContent = 'Add Class';
            openModal('add-modal');
        }

        function editClass(c) {
            document.getElementById('e-id').value = c.id;
            document.getElementById('f-name').value = c.name;
            document.getElementById('f-section').value = c.section || '';
            document.getElementById('f-year').value = c.academic_year || '2024/2025';
            document.getElementById('f-teacher').value = c.class_teacher_id || '';
            document.getElementById('m-title').textContent = 'Edit Class';
            openModal('add-modal');
        }

        async function saveClass() {
            const id = document.getElementById('e-id').value;
            const name = document.getElementById('f-name').value.trim();
            if (!name) { showToast('Class name required', 'error'); return; }
            const payload = { name, section: document.getElementById('f-section').value || null, academic_year: document.getElementById('f-year').value, class_teacher_id: document.getElementById('f-teacher').value || null };
            const { error } = id ? await db.from('classes').update(payload).eq('id', id) : await db.from('classes').insert(payload);
            if (error) { showToast('Error: ' + error.message, 'error'); return; }
            showToast(id ? 'Class updated!' : 'Class added!'); closeModal('add-modal'); loadClasses();
        }

        function deleteClass(id, name) {
            confirmAction(`Delete class "${name}"? Students in this class will become unassigned.`, async () => {
                await db.from('classes').delete().eq('id', id);
                showToast('Class deleted', 'error'); loadClasses();
            });
        }
    </script>
</body>

</html>
